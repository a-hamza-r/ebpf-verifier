options: ["!big_endian"]

code:
  <start>: |
    r1 = be64 r1 ; 0x0987654321 -> 0x2143658709000000

post: ["r1 : snumber<2396871057337221120>", "r1 : unumber<2396871057337221120>"]
---
test-case: be64 singleton on big-endian


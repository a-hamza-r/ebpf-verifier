---
test-case: negation of unknown number

pre: ["r1 : snumber", "r1 : unumber"]

code:
  <start>: |
    r1 = -r1

post: ["r1 : snumber", "r1 : unumber"]
---
test-case: negation of 32-bit singleton number

pre: ["r1 : snumber<5>", "r1 : unumber<5>"]

code:
  <start>: |
    w1 = -w1

post: ["r1 : snumber<4294967291>", "r1 : unumber<4294967291>"]
---
test-case: negation of 64-bit singleton number

pre: ["r1 : snumber<5>", "r1 : unumber<5>"]

code:
  <start>: |
    r1 = -r1

post: ["r1 : snumber<-5>", "r1 : unumber<18446744073709551611>"]
---
test-case: negation of finite interval number

pre: ["r1 : snumber<[-5, 5]>"]

code:
  <start>: |
    r1 = -r1

post: ["r1 : snumber<[-5, 5]>"]
---
test-case: be16 singleton on little-endian

pre: ["r1 : snumber<6636321>", "r1 : unumber<6636321>"]

options: ["!big_endian"]

code:
  <start>: |
    r1 = be16 r1 ; 0x654321 -> 0x2143

post: ["r1 : snumber<8515>", "r1 : unumber<8515>"]
---
test-case: be16 singleton on big-endian

pre: ["r1 : snumber<6636321>", "r1 : unumber<6636321>"]

options: ["big_endian"]

code:
  <start>: |
    r1 = be16 r1 ; 0x654321 -> 0x4321

post: ["r1 : snumber<17185>", "r1 : unumber<17185>"]
---
test-case: be32 singleton on little-endian

pre: ["r1 : snumber<40926266145>", "r1 : unumber<40926266145>"]

options: ["!big_endian"]

code:
  <start>: |
    r1 = be32 r1 ; 0x0987654321 -> 0x21436587

post: ["r1 : snumber<558065031>", "r1 : unumber<558065031>"]
---
